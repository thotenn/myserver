        abbr: PX
        href: https://proxmox.example.com:8006
        icon: si:proxmox
    - Portainer:
        abbr: PT
        href: https://portainer.example.com
        icon: si:portainer
    - Traefik:
        abbr: TR
        href: https://traefik.example.com
        icon: si:traefik

---
# ═══════════════════════════════════════════════════════════════════════════════
# EXAMPLE 12: Bookmark with env var substitution
# ═══════════════════════════════════════════════════════════════════════════════
- Internal:
    - Dashboard:
        abbr: DB
        href: "{{HOMEPAGE_VAR_DASHBOARD_URL}}"
        icon: mdi:view-dashboard

---
# ═══════════════════════════════════════════════════════════════════════════════
# EXAMPLE 13: Minimal bookmark list (one group, two links)
# ═══════════════════════════════════════════════════════════════════════════════
- Links:
    - Google:
        href: https://google.com
    - Reddit:
        href: https://reddit.com

