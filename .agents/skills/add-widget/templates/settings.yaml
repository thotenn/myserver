# ═══════════════════════════════════════════════════════════════════════════════
# EXAMPLE 15: Complete production config
# ═══════════════════════════════════════════════════════════════════════════════
title: My Dashboard
theme: dark
color: slate
language: en
columns: 3
headerStyle: underlined
cardBlur: true

layout:
  Infrastructure:
    columns: 2
    tab: Infra
  Media:
    columns: 3
    tab: Media
  Tools:
    columns: 2
    tab: Tools

quicklaunch:
  searchDescriptions: true
  hideInternetSearch: false
  hideVisitURL: false

scripts:
  enabled: true
  maxTimeout: 300
  defaultTimeout: 60
  maxConcurrent: 5
  scriptDirs:
    - scripts
