name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@latest

      - name: Install Tailwind CSS
        run: |
          curl -sLo /tmp/tailwindcss \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/tailwindcss-linux-x64
          chmod +x /tmp/tailwindcss

      - name: Generate and build
        run: |
          export PATH="/tmp:$PATH"
          templ generate
          tailwindcss -i web/tailwind/input.css -o web/static/css/main.css -c tailwind.config.js --minify
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-s -w" -o myserver-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/myserver/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: myserver-${{ matrix.goos }}-${{ matrix.goarch }}
          path: myserver-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: myserver-*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
