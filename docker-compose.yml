# docker-compose.yml — production deployment
#
# Works with plain `docker compose up -d` and with any PaaS that consumes a
# Compose file (Dokploy, Coolify, CapRover, Portainer stacks, …). The image is
# built from the Dockerfile next to this file.
#
# Deploy-specific values are NOT hardcoded here. Set them as environment
# variables where you deploy (a `.env` next to this file, or your platform's
# environment UI):
#
#   MYSERVER_HOST_PORT   host port to publish            (default 8085)
#   MYSERVER_CONFIG_DIR  host dir holding the YAML config (default ./config)
#   TZ                   container timezone              (default Etc/UTC)
#
#   HOMEPAGE_ALLOWED_HOSTS       comma-separated public hostnames, e.g.
#                                `dashboard.example.com,dashboard.example.com:443`.
#                                NOT wildcarded here on purpose — an unset value
#                                allows localhost only.
#   HOMEPAGE_SCRIPTS_ENABLED     `true` to expose the scripts feature.
#   HOMEPAGE_ALLOW_PRIVATE_HOSTS `true` (default) lets widgets reach RFC1918
#                                addresses, which is the normal case when the
#                                dashboard shares a container network with the
#                                services it monitors.
#
# Security notes:
#   * The dashboard has no internal auth — put an auth layer in front of it
#     (see README, "Security model in one paragraph").
#   * `HOMEPAGE_SCRIPTS_ENABLED` is deliberately unset here: opt in explicitly.
#     When enabled, the docker.sock mount below becomes a container-escape
#     vector if combined with an RCE in the script whitelist.
#   * Some platforms restrict the docker socket at the daemon level and need it
#     allowed per-service before the mount works.
#
services:
  myserver:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${MYSERVER_HOST_PORT:-8085}:3000"
    environment:
      - HOMEPAGE_CONFIG_DIR=/app/config
      - TZ=${TZ:-Etc/UTC}
      # Go runtime tuning — without these the runtime ignores the cgroup
      # limit (`memory: 256M` below) and RSS settles around ~135 MB because
      # GOGC=100 lets the heap double before collecting. GOMEMLIMIT makes the
      # GC aggressive near the ceiling and the scavenger returns pages to
      # the OS; GOGC=50 grows the heap by +50% instead of +100% between GCs.
      - GOMEMLIMIT=80MiB
      - GOGC=50
      # Set these in your deployment environment, not here:
      #   HOMEPAGE_ALLOWED_HOSTS, HOMEPAGE_SCRIPTS_ENABLED,
      #   HOMEPAGE_ALLOW_PRIVATE_HOSTS
    extra_hosts:
      # So the widget proxy can reach services on the host itself, via
      # host.docker.internal or the Docker bridge gateway.
      - "host.docker.internal:host-gateway"
    volumes:
      # Config YAML — bind mount from the host. Edit the files on the host
      # with your usual editor; fsnotify inside the container detects the
      # change and hot-reloads without a restart.
      - ${MYSERVER_CONFIG_DIR:-./config}:/app/config
      # Audit log + runtime data
      - myserver-data:/app/data
      # Docker socket — read/write so script wrappers can call
      # `docker restart`. If you don't use the scripts feature, mount it
      # `:ro` for defense in depth.
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  myserver-data:
    driver: local
